name: pavel-local-gates

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-direct.txt
      - run: $env:GENVM_VERSION='v0.2.16'; python scripts/compile-contracts.py
      - run: pytest -q
      - run: powershell -ExecutionPolicy Bypass -File scripts/lint-contracts.ps1
      - run: $env:GENVM_VERSION='v0.2.16'; genvm-lint schema contracts/pavel_core.py --json
      - run: $env:GENVM_VERSION='v0.2.16'; genvm-lint schema contracts/pavel_vault.py --json
      - run: $env:GENVM_VERSION='v0.2.16'; genvm-lint typecheck contracts/pavel_core.py --json
      - run: $env:GENVM_VERSION='v0.2.16'; genvm-lint typecheck contracts/pavel_vault.py --json
      - run: powershell -ExecutionPolicy Bypass -File scripts/secret-scan.ps1
      - run: node scripts/contract-source-hash.mjs
      - run: node tools/qualification/validate-manifest.mjs
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: node scripts/network-guard.mjs
